name: Generate Stats Card

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generar el stats.svg
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=agarcia-2024043&show_icons=true&include_all_commits=true&count_private=true&theme=dracula&locale=en&hide_border=false
          path: output/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar en la branch stats-output
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: stats-output
          keep_files: false
